resources:
  jobs:
    default-ccc-monitor-refresh:
      name: default-ccc-monitor-update-workflow
      schedule:
        quartz_cron_expression: "0 0 3 ? * MON"
        timezone_id: "Europe/Paris"
        pause_status: ${var.schedule_pause_status}
      tags:
        project_name: "default-ccc-classifier"
      job_clusters:
        - job_cluster_key: "default-ccc-cluster"
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            data_security_mode: "SINGLE_USER"
            node_type_id: "Standard_DS3_v2"
            driver_node_type_id: "Standard_DS3_v2"
            autoscale:
              min_workers: 1
              max_workers: 1
        
      tasks:
        - task_key: "refresh_monitor_table"
          job_cluster_key: "default-ccc-cluster"
          spark_python_task:
            python_file: "scripts/03_monitoring.py"
            parameters:
              - "--root_path"
              - ${workspace.root_path}
              - "--env"
              - ${bundle.target}
          libraries:
           - whl: ./dist/*.whl